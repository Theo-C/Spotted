name: spotted
description: "Spotted — carnet naturaliste personnel (Théo & Axelle)."
publish_to: 'none'
version: 1.5.0+6

environment:
  sdk: ^3.12.0-327.4.beta

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (Riverpod 3.x — compatible analyzer 7.x)
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2

  # Modèles immutables + sérialisation JSON (Freezed 3.x pour compat build 3.x)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Navigation déclarative
  go_router: ^14.2.0

  # Backend (Auth + Postgres + Storage)
  supabase_flutter: ^2.5.6

  # Cartographie + reverse-geocoding
  mapbox_maps_flutter: ^2.0.0

  # Sélection fichier + lecture EXIF.
  # On utilise file_picker (pas image_picker) car sur Android 13+ le nouveau
  # Photo Picker strippe systématiquement les EXIF GPS — file_picker passe par
  # ACTION_OPEN_DOCUMENT qui les préserve.
  file_picker: ^8.1.4
  native_exif: ^0.6.2

  # Demande runtime de la permission ACCESS_MEDIA_LOCATION sans laquelle
  # Android redacte les EXIF GPS lors de la copie en cache app.
  permission_handler: ^11.3.1

  # Compression photo avant envoi Vision API (Anthropic plafonne à 5 MB
  # par image en base64 — les photos modernes font souvent 8-12 MB).
  flutter_image_compress: ^2.3.0

  # Notifications locales pour rappeler à l'user de faire son obs
  # quotidienne (entretien de la série). Scheduling local, pas FCM.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Confetti pour les animations d'unlock badge / level-up.
  # (Conservé pour compat, mais l'usage tend à être retiré — l'app passe sur
  # des micro-animations type halos/scale/shimmer via flutter_animate.)
  confetti: ^0.7.0

  # DSL d'animations chainables (scale, fade, slide, shimmer, etc.) —
  # remplace les AnimationController manuels pour les micro-anim UI.
  flutter_animate: ^4.5.2

  # Position courante de l'utilisateur (bouton "ma position" sur les cartes)
  geolocator: ^13.0.2

  # Persistance locale d'une simple flag (onboarding vu, etc.)
  shared_preferences: ^2.3.3

  # HTTP (pour Mapbox Geocoding API)
  dio: ^5.5.0+1

  # Fonts (Cormorant Garamond + Karla)
  google_fonts: ^6.2.1

  # Config secrets via .env
  flutter_dotenv: ^5.1.0

  # Formats date/nombre fr_FR
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation (Freezed + Riverpod)
  build_runner: ^2.4.11
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.3

  # Génération app icon + splash screen depuis assets/icon/icon.png
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.4

  # Lint Riverpod — désactivés temporairement (conflit analyzer 7.x ↔
  # analyzer_plugin 0.12.0 transitif). À réactiver quand l'écosystème
  # rattrape l'API Element2 du nouvel analyzer.
  # custom_lint: ^0.7.3
  # riverpod_lint: ^2.6.0

flutter:
  uses-material-design: true

  # .env embarqué comme asset (lu par flutter_dotenv au runtime).
  # Ne contient que des clés "publishable" (anon Supabase + pk Mapbox).
  assets:
    - .env
    - assets/icon/

# Génération app icon — `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1F3D2E"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true

# Génération splash screen — `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#1F3D2E"
  image: "assets/icon/icon.png"
  android_12:
    color: "#1F3D2E"
    image: "assets/icon/icon.png"
