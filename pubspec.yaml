name: spotted
description: "Spotted — carnet naturaliste personnel (Théo & Axelle)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0-327.4.beta

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Modèles immutables + sérialisation JSON
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Navigation déclarative
  go_router: ^14.2.0

  # Backend (Auth + Postgres + Storage)
  supabase_flutter: ^2.5.6

  # Cartographie + reverse-geocoding
  mapbox_maps_flutter: ^2.0.0

  # Sélection photo + lecture EXIF
  image_picker: ^1.1.2
  native_exif: ^0.6.2

  # HTTP (pour Mapbox Geocoding API)
  dio: ^5.5.0+1

  # Fonts (Cormorant Garamond + Karla)
  google_fonts: ^6.2.1

  # Config secrets via .env
  flutter_dotenv: ^5.1.0

  # Formats date/nombre fr_FR
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation (Freezed + Riverpod)
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

  # Lint Riverpod
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.0

flutter:
  uses-material-design: true

  # .env embarqué comme asset (lu par flutter_dotenv au runtime).
  # Ne contient que des clés "publishable" (anon Supabase + pk Mapbox).
  assets:
    - .env
