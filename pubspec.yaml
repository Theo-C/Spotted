name: spotted
description: "Spotted — carnet naturaliste personnel (Théo & Axelle)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0-327.4.beta

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (Riverpod 3.x — compatible analyzer 7.x)
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2

  # Modèles immutables + sérialisation JSON (Freezed 3.x pour compat build 3.x)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Navigation déclarative
  go_router: ^14.2.0

  # Backend (Auth + Postgres + Storage)
  supabase_flutter: ^2.5.6

  # Cartographie + reverse-geocoding
  mapbox_maps_flutter: ^2.0.0

  # Sélection fichier + lecture EXIF.
  # On utilise file_picker (pas image_picker) car sur Android 13+ le nouveau
  # Photo Picker strippe systématiquement les EXIF GPS — file_picker passe par
  # ACTION_OPEN_DOCUMENT qui les préserve.
  file_picker: ^8.1.4
  native_exif: ^0.6.2

  # HTTP (pour Mapbox Geocoding API)
  dio: ^5.5.0+1

  # Fonts (Cormorant Garamond + Karla)
  google_fonts: ^6.2.1

  # Config secrets via .env
  flutter_dotenv: ^5.1.0

  # Formats date/nombre fr_FR
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation (Freezed + Riverpod)
  build_runner: ^2.4.11
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.3

  # Lint Riverpod — désactivés temporairement (conflit analyzer 7.x ↔
  # analyzer_plugin 0.12.0 transitif). À réactiver quand l'écosystème
  # rattrape l'API Element2 du nouvel analyzer.
  # custom_lint: ^0.7.3
  # riverpod_lint: ^2.6.0

flutter:
  uses-material-design: true

  # .env embarqué comme asset (lu par flutter_dotenv au runtime).
  # Ne contient que des clés "publishable" (anon Supabase + pk Mapbox).
  assets:
    - .env
